spring.application.name=spendguard
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/spendguard}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:spendguard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:spendguard_dev_only}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
